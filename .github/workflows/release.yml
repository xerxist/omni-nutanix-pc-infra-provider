# Vets, tests and vulnerability-scans the source, then builds the provider image.
# Pull requests and main pushes only verify the build;
# a vMAJOR.MINOR.PATCH tag on main publishes to GHCR and creates a release. The
# version embedded in the binary is the tag without its leading "v".
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Reviewed multi-arch index digests. Update both tag and digest together; the
  # builder's Go version must satisfy go.mod.
  BUILD_IMAGE: docker.io/library/golang:1.27.3-alpine@sha256:fa3d596898d9f126af7c01d14ee7597bab3f39cccf392ef36b69fe77cd681f18
  RUNTIME_IMAGE: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
  PLATFORMS: linux/amd64,linux/arm64
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  # Gates every build and release: runs in the pinned builder image, so checks use
  # the same Go toolchain as the published binary. The source is mounted read-only.
  check:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vet, test and scan for vulnerabilities
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            -e CGO_ENABLED=0 -e GOFLAGS=-mod=readonly -e GOTOOLCHAIN=local -e GOVULNCHECK_VERSION \
            "$BUILD_IMAGE" sh -euc '
              go vet ./...
              go test ./...
              go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
            '

  verify:
    if: github.ref_type != 'tag'
    needs: check
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Development version
        id: version
        run: echo "version=dev-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build all platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          provenance: false
          sbom: false
          build-args: |
            BUILD_IMAGE=${{ env.BUILD_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            IMAGE_VERSION=${{ steps.version.outputs.version }}

      - name: Load amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: provider:smoke
          provenance: false
          sbom: false
          build-args: |
            BUILD_IMAGE=${{ env.BUILD_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            IMAGE_VERSION=${{ steps.version.outputs.version }}

      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --read-only --cap-drop=ALL --network=none provider:smoke --help >/dev/null
          test "$(docker run --rm --read-only --cap-drop=ALL --network=none provider:smoke --version)" = "provider version ${VERSION}"
          test "$(docker image inspect --format '{{.Config.User}}' provider:smoke)" = "65532:65532"

  publish:
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9a-z-]+(\.[0-9a-z-]+)*)?$'
          if [[ "$TAG" != v* ]] || ! [[ "$version" =~ $semver ]]; then
            echo "::error::Release tags must be lowercase vMAJOR.MINOR.PATCH[-prerelease]"; exit 1
          fi
          # Only release commits that are already on main ("identical" or "behind").
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq .status)"
          if [[ "$status" != identical && "$status" != behind ]]; then
            echo "::error::Tag ${TAG} must point to a commit on main"; exit 1
          fi
          {
            echo "version=${version}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Load amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: provider:smoke
          provenance: false
          sbom: false
          build-args: |
            BUILD_IMAGE=${{ env.BUILD_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}

      - name: Smoke test
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker run --rm --read-only --cap-drop=ALL --network=none provider:smoke --help >/dev/null
          test "$(docker run --rm --read-only --cap-drop=ALL --network=none provider:smoke --version)" = "provider version ${VERSION}"
          test "$(docker image inspect --format '{{.Config.User}}' provider:smoke)" = "65532:65532"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.description=Omni infrastructure provider for Nutanix Prism Central
            index:org.opencontainers.image.licenses=MPL-2.0
            index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_IMAGE=${{ env.BUILD_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records are only available for organization-owned repositories.
          create-storage-record: false

  release:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Container image

          Platforms: \`linux/amd64\`, \`linux/arm64\`

          Deploy by digest:

          \`\`\`text
          ${IMAGE}@${DIGEST}
          \`\`\`

          Tag (mutable, for reference only): \`${IMAGE}:${TAG}\`

          Verify build provenance:

          \`\`\`sh
          gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}
          \`\`\`
          EOF
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file notes.md --generate-notes "${prerelease[@]}"
